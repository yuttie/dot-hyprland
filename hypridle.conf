general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd =
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    # Turn off the screen earlier during screen lock
    timeout = 10
    on-timeout = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({ action = 'disable' })"
    on-resume = pidof hyprlock && hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}

listener {
    # Lock the screen when timeout has passed
    timeout = 120
    on-timeout = ~/.config/hypr/battery-sleep.sh
}

listener {
    # Lock the screen when timeout has passed
    timeout = 180
    on-timeout = loginctl lock-session
}

listener {
    # Turn off the screen when timeout has passed
    timeout = 190
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'disable' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}
